
[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripmate-ai"
version = "0.1.0"
description = "Multimodal Agentic AI Travel Planner with LangGraph and MCP"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Agent orchestration
    "langgraph>=1.2.19,<2.0.0",
    "langchain>=1.4.7,<2.0.0",
    "langchain-core>=1.4.7,<2.0.0",

    # Gemini integration
    "langchain-google-genai>=4.4.2,<5.0.0",

    # MCP integration
    "langchain-mcp-adapters>=0.3.2,<0.4.0",
    "mcp>=1.24.0,<2.0.0",

    # HTTP and validation
    "httpx>=0.27.0",
    "pydantic>=2.8.0",

    # Environment configuration
    "python-dotenv>=1.0.1",

    # Web search
    "ddgs>=9.0.0",

    # UI
    "gradio>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
